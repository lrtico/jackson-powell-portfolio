<app-primary-nav></app-primary-nav>

<main class="main">
  <div class="content">
    <div class="router-container" style="position: relative;">
      <div *ngIf="showRouteRect" class="route-rect route-rect--blueberry"
        [@rectSlide]="{ value: rectState, params: { delay: '0ms' } }" (@rectSlide.done)="onRectSlideDone($event)">
      </div>
      <div *ngIf="showRouteRect" class="route-rect route-rect--strawberry"
        [@rectSlide]="{ value: rectState, params: { delay: '100ms' } }" (@rectSlide.done)="onRectSlideDone($event)">
      </div>
      <div *ngIf="showRouteRect" class="route-rect route-rect--chocolate"
        [@rectSlide]="{ value: rectState, params: { delay: '200ms' } }" (@rectSlide.done)="onRectSlideDone($event)">
      </div>
      <router-outlet #outlet="outlet" [@routeAnimations]="getRouteAnimationData(outlet)"></router-outlet>
    </div>
  </div>
</main>
